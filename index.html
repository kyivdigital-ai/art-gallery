<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Artwork</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    #app {
      width: 100vw;
      height: 100vh;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import * as THREE from "https://esm.sh/three@0.160.0";
    import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";

    const app = document.getElementById("app");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const camera = new THREE.PerspectiveCamera(
      32,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0, 7.2);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    app.appendChild(renderer.domElement);

    // LIGHTING
    const ambient = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambient);

    const mainLight = new THREE.DirectionalLight(0xffffff, 1.4);
    mainLight.position.set(4, 5, 6);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 2048;
    mainLight.shadow.mapSize.height = 2048;
    mainLight.shadow.camera.near = 0.5;
    mainLight.shadow.camera.far = 30;
    mainLight.shadow.camera.left = -8;
    mainLight.shadow.camera.right = 8;
    mainLight.shadow.camera.top = 8;
    mainLight.shadow.camera.bottom = -8;
    scene.add(mainLight);

    const sideLight = new THREE.DirectionalLight(0xffffff, 0.45);
    sideLight.position.set(-4, 1, 3);
    scene.add(sideLight);

    // ARTWORK
    const artworkGroup = new THREE.Group();
    scene.add(artworkGroup);

    // Source image ratio: 1243 × 1713
    const artworkHeight = 3.2;
    const artworkWidth = artworkHeight * (1243 / 1713);
    const depth = 0.16;

    const textureLoader = new THREE.TextureLoader();
    const artworkTexture = textureLoader.load("./artwork.png");
    artworkTexture.colorSpace = THREE.SRGBColorSpace;
    artworkTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

    const edgeMaterial = new THREE.MeshStandardMaterial({
      color: 0x111111,
      roughness: 0.4,
      metalness: 0.05
    });

    const backMaterial = new THREE.MeshStandardMaterial({
      color: 0x151515,
      roughness: 0.65,
      metalness: 0
    });

    const frontMaterial = new THREE.MeshStandardMaterial({
      map: artworkTexture,
      roughness: 0.9,
      metalness: 0
    });

    // BoxGeometry material order: right, left, top, bottom, front, back
    const materials = [
      edgeMaterial,
      edgeMaterial,
      edgeMaterial,
      edgeMaterial,
      frontMaterial,
      backMaterial
    ];

    const geometry = new THREE.BoxGeometry(
      artworkWidth,
      artworkHeight,
      depth
    );

    const artwork = new THREE.Mesh(geometry, materials);
    artwork.castShadow = true;
    artwork.receiveShadow = true;
    artworkGroup.add(artwork);

    // Initial position
    artworkGroup.rotation.y = -0.32;
    artworkGroup.rotation.x = -0.025;

    // FLOOR / SHADOW
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.ShadowMaterial({
        color: 0x000000,
        opacity: 0.13
      })
    );

    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -(artworkHeight / 2) - 0.65;
    floor.receiveShadow = true;
    scene.add(floor);

    // CONTROLS
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.075;
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.minAzimuthAngle = -0.75;
    controls.maxAzimuthAngle = 0.75;
    controls.minPolarAngle = Math.PI / 2 - 0.42;
    controls.maxPolarAngle = Math.PI / 2 + 0.42;
    controls.rotateSpeed = 0.75;
    controls.target.set(0, 0, 0);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }

    window.addEventListener("resize", resize);
  </script>
</body>
</html>
