<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>ROMASHKA</title>

  <style>
    :root {
      background: #482A34;
      color: #ECCDD9;
      font-family: "Courier New", Courier, monospace;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #gallery {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    html,
    body {
      background: #482A34;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    /* =========================================
       MAIN GALLERY
    ========================================= */

    #gallery {
      position: relative;

      width: 100%;
      height: 100svh;

      overflow: hidden;

      background: #482A34;
    }

    /* =========================================
       SLIDES
    ========================================= */

    .slide {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      opacity: 0;
      visibility: hidden;

      pointer-events: none;

      transition:
        opacity 320ms ease,
        visibility 320ms ease;
    }

    .slide.is-active {
      opacity: 1;
      visibility: visible;

      pointer-events: auto;
    }

    /* =========================================
       3D STAGE
    ========================================= */

    #three-stage {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100svh;

      overflow: hidden;

      background: #482A34;

      touch-action: none;
    }

    #three-stage canvas {
      display: block;

      width: 100%;
      height: 100%;

      outline: none;

      touch-action: none;

      -webkit-tap-highlight-color: transparent;

      cursor: grab;
    }

    #three-stage canvas:active {
      cursor: grabbing;
    }

    /* =========================================
       CLOSE UP
    ========================================= */

    .closeup-slide {
      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100svh;

      padding: 5vh 5vw;

      background: #482A34;

      cursor: pointer;
    }

    .closeup-slide img {
      display: block;

      width: auto;
      height: auto;

      max-width: 88%;
      max-height: 86svh;

      object-fit: contain;

      user-select: none;

      -webkit-user-drag: none;

      cursor: pointer;
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 700px) {

      .closeup-slide {
        padding:
          4vh
          5vw;
      }

      .closeup-slide img {
        max-width: 92vw;
        max-height: 78svh;
      }

    }
  </style>
</head>


<body>

  <main id="gallery">

    <!-- ======================================
         SLIDE 1 — 3D ARTWORK
    ======================================= -->

    <section
      class="slide is-active"
      id="artwork-slide"
      aria-hidden="false"
    >

      <div id="three-stage"></div>

    </section>


    <!-- ======================================
         SLIDE 2 — CLOSE UP
    ======================================= -->

    <section
      class="slide closeup-slide"
      id="closeup-slide"
      aria-hidden="true"
    >

      <img
        src="./closeup.jpg"
        alt="Close-up detail of ROMASHKA"
        draggable="false"
      />

    </section>

  </main>


  <script type="module">

    import * as THREE
      from "https://esm.sh/three@0.160.0";


    /* ==================================================
       SLIDES
    ================================================== */

    const artworkSlide =
      document.getElementById("artwork-slide");

    const closeupSlide =
      document.getElementById("closeup-slide");


    function showArtwork() {

      artworkSlide.classList.add(
        "is-active"
      );

      closeupSlide.classList.remove(
        "is-active"
      );


      artworkSlide.setAttribute(
        "aria-hidden",
        "false"
      );

      closeupSlide.setAttribute(
        "aria-hidden",
        "true"
      );

    }


    function showCloseup() {

      artworkSlide.classList.remove(
        "is-active"
      );

      closeupSlide.classList.add(
        "is-active"
      );


      artworkSlide.setAttribute(
        "aria-hidden",
        "true"
      );

      closeupSlide.setAttribute(
        "aria-hidden",
        "false"
      );

    }


    closeupSlide.addEventListener(
      "click",
      showArtwork
    );


    /* ==================================================
       THREE.JS
    ================================================== */

    const stage =
      document.getElementById(
        "three-stage"
      );


    /* ==================================================
       SCENE
    ================================================== */

    const scene =
      new THREE.Scene();


    scene.background =
      new THREE.Color(
        0x482A34
      );


    /* ==================================================
       CAMERA
    ================================================== */

    const camera =
      new THREE.PerspectiveCamera(

        32,

        1,

        0.1,

        100

      );


    camera.position.set(
      0,
      0,
      7
    );


    /* ==================================================
       RENDERER
    ================================================== */

    const renderer =
      new THREE.WebGLRenderer({

        antialias: true,

        alpha: false,

        powerPreference:
          "high-performance"

      });


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.shadowMap.enabled =
      true;


    renderer.shadowMap.type =
      THREE.PCFSoftShadowMap;


    renderer.setPixelRatio(

      Math.min(
        window.devicePixelRatio,
        2
      )

    );


    stage.appendChild(
      renderer.domElement
    );


    /* ==================================================
       LIGHTING
    ================================================== */

    const ambientLight =
      new THREE.AmbientLight(

        0xffffff,

        1.2

      );


    scene.add(
      ambientLight
    );


    const keyLight =
      new THREE.DirectionalLight(

        0xffffff,

        1.35

      );


    keyLight.position.set(
      2.5,
      7,
      5
    );


    keyLight.castShadow =
      true;


    keyLight.shadow.mapSize.set(
      2048,
      2048
    );


    keyLight.shadow.camera.near =
      0.5;


    keyLight.shadow.camera.far =
      25;


    keyLight.shadow.camera.left =
      -5;


    keyLight.shadow.camera.right =
      5;


    keyLight.shadow.camera.top =
      5;


    keyLight.shadow.camera.bottom =
      -5;


    scene.add(
      keyLight
    );


    const fillLight =
      new THREE.DirectionalLight(

        0xffffff,

        0.25

      );


    fillLight.position.set(
      -4,
      2,
      4
    );


    scene.add(
      fillLight
    );


    /* ==================================================
       ARTWORK OBJECT
    ================================================== */

    const artworkGroup =
      new THREE.Group();


    scene.add(
      artworkGroup
    );


    /*
      Visible framed artwork ratio.
    */

    const visibleAspect =
      1406 / 1939;


    /*
      Physical Three.js size.

      Camera automatically changes distance,
      so don't keep changing this for mobile.
    */

    const artworkHeight =
      2.8;


    const artworkWidth =
      artworkHeight *
      visibleAspect;


    const depth =
      0.13;


    /* ==================================================
       FRAME / BODY
    ================================================== */

    const bodyMaterial =
      new THREE.MeshStandardMaterial({

        color:
          0x101010,

        roughness:
          0.95,

        metalness:
          0

      });


    const bodyGeometry =
      new THREE.BoxGeometry(

        artworkWidth,

        artworkHeight,

        depth

      );


    const body =
      new THREE.Mesh(

        bodyGeometry,

        bodyMaterial

      );


    body.castShadow =
      true;


    body.receiveShadow =
      true;


    artworkGroup.add(
      body
    );


    /* ==================================================
       FRONT IMAGE
    ================================================== */

    const textureLoader =
      new THREE.TextureLoader();


    textureLoader.load(

      "./artwork-v2.png",


      (texture) => {

        texture.colorSpace =
          THREE.SRGBColorSpace;


        texture.anisotropy =
          renderer.capabilities
            .getMaxAnisotropy();


        texture.wrapS =
          THREE.ClampToEdgeWrapping;


        texture.wrapT =
          THREE.ClampToEdgeWrapping;


        /*
          Crop transparent margins.

          These are percentages,
          so they also work with
          your high-resolution file.
        */

        texture.repeat.set(

          0.96765,

          0.94678

        );


        texture.offset.set(

          0.01583,

          0.02490

        );


        texture.minFilter =
          THREE.LinearFilter;


        texture.magFilter =
          THREE.LinearFilter;


        texture.generateMipmaps =
          false;


        texture.needsUpdate =
          true;


        /*
          Basic material means
          the artwork itself is not
          darkened by the 3D lighting.
        */

        const frontMaterial =
          new THREE.MeshBasicMaterial({

            map:
              texture,

            transparent:
              true,

            alphaTest:
              0.001,

            toneMapped:
              false,

            side:
              THREE.FrontSide

          });


        const frontGeometry =
          new THREE.PlaneGeometry(

            artworkWidth,

            artworkHeight

          );


        const front =
          new THREE.Mesh(

            frontGeometry,

            frontMaterial

          );


        front.position.z =
          depth / 2 +
          0.002;


        artworkGroup.add(
          front
        );

      },


      undefined,


      (error) => {

        console.error(
          "Could not load artwork-v2.png",
          error
        );

      }

    );


    /* ==================================================
       INITIAL ROTATION
    ================================================== */

    let targetRotationY =
      -0.12;


    let targetRotationX =
      -0.01;


    let currentRotationY =
      targetRotationY;


    let currentRotationX =
      targetRotationX;


    /* ==================================================
       SHORT SHADOW
    ================================================== */

    const floor =
      new THREE.Mesh(

        new THREE.PlaneGeometry(
          12,
          12
        ),

        new THREE.ShadowMaterial({

          color:
            0x000000,

          opacity:
            0.10

        })

      );


    floor.rotation.x =
      -Math.PI / 2;


    floor.position.y =
      -artworkHeight / 2 -
      0.10;


    floor.receiveShadow =
      true;


    scene.add(
      floor
    );


    /* ==================================================
       DRAG + CLICK
    ================================================== */

    let dragging =
      false;


    let moved =
      false;


    let startX =
      0;


    let startY =
      0;


    let lastX =
      0;


    let lastY =
      0;


    renderer.domElement
      .addEventListener(

        "pointerdown",

        (event) => {

          dragging =
            true;


          moved =
            false;


          startX =
            event.clientX;


          startY =
            event.clientY;


          lastX =
            event.clientX;


          lastY =
            event.clientY;


          renderer.domElement
            .setPointerCapture(
              event.pointerId
            );

        }

      );


    renderer.domElement
      .addEventListener(

        "pointermove",

        (event) => {

          if (!dragging) {
            return;
          }


          const dx =
            event.clientX -
            lastX;


          const dy =
            event.clientY -
            lastY;


          /*
            Distinguish drag from click.
          */

          if (

            Math.abs(
              event.clientX -
              startX
            ) > 6

            ||

            Math.abs(
              event.clientY -
              startY
            ) > 6

          ) {

            moved =
              true;

          }


          lastX =
            event.clientX;


          lastY =
            event.clientY;


          targetRotationY +=
            dx * 0.006;


          targetRotationX +=
            dy * 0.004;


          /*
            Never allow the back
            of the artwork to appear.
          */

          targetRotationY =
            THREE.MathUtils.clamp(

              targetRotationY,

              -0.52,

              0.52

            );


          targetRotationX =
            THREE.MathUtils.clamp(

              targetRotationX,

              -0.16,

              0.16

            );

        }

      );


    function finishPointer(
      event
    ) {

      if (!dragging) {
        return;
      }


      dragging =
        false;


      if (

        event.pointerId !==
        undefined

        &&

        renderer.domElement
          .hasPointerCapture(
            event.pointerId
          )

      ) {

        renderer.domElement
          .releasePointerCapture(
            event.pointerId
          );

      }


      /*
        Click without drag
        opens the close-up.
      */

      if (!moved) {

        showCloseup();

      }

    }


    renderer.domElement
      .addEventListener(

        "pointerup",

        finishPointer

      );


    renderer.domElement
      .addEventListener(

        "pointercancel",

        () => {

          dragging =
            false;

        }

      );


    /* ==================================================
       RESPONSIVE AUTO-FIT
    ================================================== */

    function resize() {

      const width =
        Math.max(
          1,
          stage.clientWidth
        );


      const height =
        Math.max(
          1,
          stage.clientHeight
        );


      const aspect =
        width /
        height;


      camera.aspect =
        aspect;


      camera.updateProjectionMatrix();


      renderer.setSize(

        width,

        height,

        false

      );


      renderer.setPixelRatio(

        Math.min(

          window.devicePixelRatio,

          2

        )

      );


      /*
        The artwork should use roughly
        72% of screen height on desktop
        and 66% on narrow screens.
      */

      const narrow =
        width < 700;


      const desiredHeightFraction =
        narrow
          ? 0.66
          : 0.72;


      const desiredWidthFraction =
        narrow
          ? 0.84
          : 0.82;


      /*
        Extra safety space for rotation
        and frame depth.
      */

      const safeHeight =
        artworkHeight *
        1.14;


      const safeWidth =
        artworkWidth *
        1.20;


      const verticalFov =
        THREE.MathUtils
          .degToRad(
            camera.fov
          );


      /*
        Distance required by height.
      */

      const distanceByHeight =

        (
          safeHeight /
          desiredHeightFraction
        )

        /

        (
          2 *
          Math.tan(
            verticalFov / 2
          )
        );


      /*
        Distance required by width.
      */

      const horizontalFov =

        2 *

        Math.atan(

          Math.tan(
            verticalFov / 2
          )

          *

          aspect

        );


      const distanceByWidth =

        (
          safeWidth /
          desiredWidthFraction
        )

        /

        (
          2 *
          Math.tan(
            horizontalFov / 2
          )
        );


      /*
        Use whichever needs more space.
        This prevents cropping.
      */

      const cameraDistance =
        Math.max(

          distanceByHeight,

          distanceByWidth

        );


      camera.position.set(

        0,

        0,

        cameraDistance

      );


      /*
        Always center inside iframe.

        Readymag decides whether this
        iframe itself is left/right.
      */

      artworkGroup.position.set(

        0,

        0,

        0

      );

    }


    resize();


    window.addEventListener(
      "resize",
      resize
    );


    /* ==================================================
       ANIMATION
    ================================================== */

    function animate() {

      requestAnimationFrame(
        animate
      );


      currentRotationY +=

        (
          targetRotationY -
          currentRotationY
        )

        *

        0.09;


      currentRotationX +=

        (
          targetRotationX -
          currentRotationX
        )

        *

        0.09;


      artworkGroup.rotation.y =
        currentRotationY;


      artworkGroup.rotation.x =
        currentRotationX;


      renderer.render(

        scene,

        camera

      );

    }


    animate();


    showArtwork();

  </script>

</body>

</html>
