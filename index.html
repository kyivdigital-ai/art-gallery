<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>Artwork</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #482A34;
    }

    #gallery {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #482A34;
    }

    /* =========================
       SLIDES
    ========================= */

    .slide {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 380ms ease,
        visibility 380ms ease;
    }

    .slide.is-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* =========================
       3D
    ========================= */

    #three-stage {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;

      width: 100%;
      height: 100%;

      touch-action: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* =========================
       CLOSE-UP
    ========================= */

    .closeup-slide {
      display: flex;
      align-items: center;
      justify-content: flex-start;

      padding:
        5vh
        5vw;

      background: #482A34;

      cursor: pointer;
    }

    .closeup-slide img {
      display: block;

      max-width: min(58vw, 900px);
      max-height: 86vh;

      width: auto;
      height: auto;

      object-fit: contain;

      user-select: none;
      -webkit-user-drag: none;

      cursor: pointer;
    }

    /* =========================
       COUNTER
    ========================= */

    .gallery-counter {
      position: fixed;

      left: 30%;
      bottom: 12px;

      transform: translateX(-50%);

      z-index: 9999;

      color: #ECCDD9;

      font-family: "Courier New", Courier, monospace;
      font-size: 8px;

      letter-spacing: 0.08em;

      pointer-events: none;

      opacity: 0.7;
    }

    /* =========================
       PHONE / NARROW BLOCK
    ========================= */

    @media (max-width: 700px) {

      .closeup-slide {
        justify-content: center;

        padding:
          4vh
          5vw;
      }

      .closeup-slide img {
        max-width: 92vw;
        max-height: 84vh;
      }

      .gallery-counter {
        left: 50%;
        bottom: 10px;
      }
    }
  </style>
</head>

<body>

  <main id="gallery">

    <!-- 3D ARTWORK -->
    <section
      class="slide is-active"
      data-slide="0"
      aria-hidden="false"
    >
      <div id="three-stage"></div>
    </section>


    <!-- CLOSE UP -->
    <section
      class="slide closeup-slide"
      data-slide="1"
      aria-hidden="true"
      id="closeup-slide"
    >
      <img
        src="./closeup.jpg"
        alt="Close-up detail of the artwork"
        draggable="false"
      />
    </section>

  </main>


  <div
    class="gallery-counter"
    id="counter"
  >
    01 / 02
  </div>


  <script type="module">

    import * as THREE
      from "https://esm.sh/three@0.160.0";


    /* ==================================================
       SLIDESHOW
    ================================================== */

    const slides =
      [...document.querySelectorAll(".slide")];

    const closeupSlide =
      document.getElementById("closeup-slide");

    const counter =
      document.getElementById("counter");

    let currentSlide = 0;


    function showSlide(index) {

      currentSlide =
        (index + slides.length) % slides.length;


      slides.forEach((slide, i) => {

        const active =
          i === currentSlide;


        slide.classList.toggle(
          "is-active",
          active
        );


        slide.setAttribute(
          "aria-hidden",
          String(!active)
        );

      });


      counter.textContent =
        `${String(currentSlide + 1).padStart(2, "0")} / ${String(slides.length).padStart(2, "0")}`;

    }


    /* CLICK CLOSE-UP → BACK */

    closeupSlide.addEventListener(
      "click",
      () => {

        showSlide(0);

      }
    );


    /* ==================================================
       THREE.JS
    ================================================== */

    const app =
      document.getElementById("three-stage");


    const scene =
      new THREE.Scene();


    scene.background =
      new THREE.Color(0x482A34);


    /* ==================================================
       CAMERA
    ================================================== */

    const camera =
      new THREE.PerspectiveCamera(
        32,
        1,
        0.1,
        100
      );


    camera.position.set(
      0,
      0,
      7
    );


    /* ==================================================
       RENDERER
    ================================================== */

    const renderer =
      new THREE.WebGLRenderer({

        antialias: true,

        alpha: false,

        powerPreference:
          "high-performance"

      });


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.shadowMap.enabled =
      true;


    renderer.shadowMap.type =
      THREE.PCFSoftShadowMap;


    app.appendChild(
      renderer.domElement
    );


    /* ==================================================
       LIGHTS
    ================================================== */

    const ambientLight =
      new THREE.AmbientLight(
        0xffffff,
        1.25
      );


    scene.add(
      ambientLight
    );


    const keyLight =
      new THREE.DirectionalLight(
        0xffffff,
        1.45
      );


    keyLight.position.set(
      2.5,
      8,
      5
    );


    keyLight.castShadow =
      true;


    keyLight.shadow.mapSize.set(
      2048,
      2048
    );


    keyLight.shadow.camera.near =
      0.5;

    keyLight.shadow.camera.far =
      25;

    keyLight.shadow.camera.left =
      -5;

    keyLight.shadow.camera.right =
      5;

    keyLight.shadow.camera.top =
      5;

    keyLight.shadow.camera.bottom =
      -5;


    scene.add(
      keyLight
    );


    const fillLight =
      new THREE.DirectionalLight(
        0xffffff,
        0.28
      );


    fillLight.position.set(
      -4,
      2,
      4
    );


    scene.add(
      fillLight
    );


    /* ==================================================
       ARTWORK
    ================================================== */

    const artworkGroup =
      new THREE.Group();


    scene.add(
      artworkGroup
    );


    const visibleAspect =
      1406 / 1939;


    const artworkHeight =
      2.6;


    const artworkWidth =
      artworkHeight * visibleAspect;


    const depth =
      0.13;


    /* ==================================================
       3D BLACK BODY
    ================================================== */

    const bodyMaterial =
      new THREE.MeshStandardMaterial({

        color: 0x101010,

        roughness: 0.92,

        metalness: 0

      });


    const body =
      new THREE.Mesh(

        new THREE.BoxGeometry(

          artworkWidth,

          artworkHeight,

          depth

        ),

        bodyMaterial

      );


    body.castShadow =
      true;


    body.receiveShadow =
      true;


    artworkGroup.add(
      body
    );


    /* ==================================================
       FRONT IMAGE
    ================================================== */

    const textureLoader =
      new THREE.TextureLoader();


    textureLoader.load(

      "./artwork-v2.png",

      (texture) => {

        texture.colorSpace =
          THREE.SRGBColorSpace;


        texture.anisotropy =
          renderer.capabilities
            .getMaxAnisotropy();


        texture.wrapS =
          THREE.ClampToEdgeWrapping;


        texture.wrapT =
          THREE.ClampToEdgeWrapping;


        /*
          Crop transparent edges.
        */

        texture.repeat.set(
          0.96765,
          0.94678
        );


        texture.offset.set(
          0.01583,
          0.02490
        );


        texture.minFilter =
          THREE.LinearFilter;


        texture.magFilter =
          THREE.LinearFilter;


        texture.generateMipmaps =
          false;


        texture.needsUpdate =
          true;


        const frontMaterial =
          new THREE.MeshBasicMaterial({

            map: texture,

            transparent: true,

            alphaTest: 0.001,

            toneMapped: false,

            side: THREE.FrontSide

          });


        const front =
          new THREE.Mesh(

            new THREE.PlaneGeometry(

              artworkWidth,

              artworkHeight

            ),

            frontMaterial

          );


        front.position.z =
          depth / 2 + 0.002;


        artworkGroup.add(
          front
        );

      },

      undefined,

      (error) => {

        console.error(
          "Could not load artwork-v2.png",
          error
        );

      }

    );


    /* ==================================================
       STARTING ROTATION
    ================================================== */

    let targetRotationY =
      -0.15;


    let targetRotationX =
      -0.015;


    let currentRotationY =
      targetRotationY;


    let currentRotationX =
      targetRotationX;


    /* ==================================================
       SHADOW
    ================================================== */

    const floor =
      new THREE.Mesh(

        new THREE.PlaneGeometry(
          14,
          14
        ),

        new THREE.ShadowMaterial({

          color: 0x000000,

          opacity: 0.11

        })

      );


    floor.rotation.x =
      -Math.PI / 2;


    floor.position.y =
      -(artworkHeight / 2) - 0.11;


    floor.receiveShadow =
      true;


    scene.add(
      floor
    );


    /* ==================================================
       DRAG + CLICK
    ================================================== */

    let dragging =
      false;


    let moved =
      false;


    let startX =
      0;


    let startY =
      0;


    let lastX =
      0;


    let lastY =
      0;


    renderer.domElement.addEventListener(
      "pointerdown",
      (event) => {

        dragging =
          true;


        moved =
          false;


        startX =
          event.clientX;


        startY =
          event.clientY;


        lastX =
          event.clientX;


        lastY =
          event.clientY;


        renderer.domElement
          .setPointerCapture(
            event.pointerId
          );

      }
    );


    renderer.domElement.addEventListener(
      "pointermove",
      (event) => {

        if (!dragging) return;


        const dx =
          event.clientX - lastX;


        const dy =
          event.clientY - lastY;


        if (

          Math.abs(
            event.clientX - startX
          ) > 6

          ||

          Math.abs(
            event.clientY - startY
          ) > 6

        ) {

          moved =
            true;

        }


        lastX =
          event.clientX;


        lastY =
          event.clientY;


        targetRotationY +=
          dx * 0.006;


        targetRotationX +=
          dy * 0.0045;


        targetRotationY =
          THREE.MathUtils.clamp(

            targetRotationY,

            -0.58,

            0.58

          );


        targetRotationX =
          THREE.MathUtils.clamp(

            targetRotationX,

            -0.18,

            0.18

          );

      }
    );


    function stopDrag(event) {

      if (!dragging) return;


      dragging =
        false;


      if (

        event &&

        event.pointerId !== undefined &&

        renderer.domElement
          .hasPointerCapture(
            event.pointerId
          )

      ) {

        renderer.domElement
          .releasePointerCapture(
            event.pointerId
          );

      }


      /* CLICK → CLOSE-UP */

      if (!moved) {

        showSlide(1);

      }

    }


    renderer.domElement.addEventListener(
      "pointerup",
      stopDrag
    );


    renderer.domElement.addEventListener(
      "pointercancel",
      () => {

        dragging =
          false;

      }
    );


    /* ==================================================
       ANIMATION
    ================================================== */

    function animate() {

      requestAnimationFrame(
        animate
      );


      currentRotationY +=
        (
          targetRotationY -
          currentRotationY
        ) * 0.09;


      currentRotationX +=
        (
          targetRotationX -
          currentRotationX
        ) * 0.09;


      artworkGroup.rotation.y =
        currentRotationY;


      artworkGroup.rotation.x =
        currentRotationX;


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /* ==================================================
       AUTO FIT + LEFT POSITION
    ================================================== */

    function resize() {

      const w =
        Math.max(
          1,
          app.clientWidth
        );


      const h =
        Math.max(
          1,
          app.clientHeight
        );


      const aspect =
        w / h;


      camera.aspect =
        aspect;


      camera.updateProjectionMatrix();


      renderer.setSize(
        w,
        h,
        false
      );


      renderer.setPixelRatio(

        Math.min(
          window.devicePixelRatio,
          3
        )

      );


      /*
        Narrow mode is used not only for phones,
        but also for narrow Readymag iframe blocks.
      */

      const narrow =
        w < 700 ||
        aspect < 0.82;


      const vFov =
        THREE.MathUtils.degToRad(
          camera.fov
        );


      /*
        Add safety margins around rotated frame.
      */

      const safeHeight =
        artworkHeight * 1.2;


      const safeWidth =
        artworkWidth * 1.25;


      /*
        On desktop artwork may occupy ~72% height.
        On mobile ~68%.
      */

      const desiredHeight =
        narrow
          ? 0.68
          : 0.72;


      const desiredWidth =
        narrow
          ? 0.82
          : 0.72;


      const distanceByHeight =

        (
          safeHeight /
          desiredHeight
        )

        /

        (
          2 *
          Math.tan(
            vFov / 2
          )
        );


      const distanceByWidth =

        (
          safeWidth /
          desiredWidth /
          aspect
        )

        /

        (
          2 *
          Math.tan(
            vFov / 2
          )
        );


      const distance =
        Math.max(

          distanceByHeight,

          distanceByWidth

        );


      camera.position.z =
        distance;


      /*
        Calculate visible world width
        at artwork depth.
      */

      const visibleHeight =

        2 *

        Math.tan(
          vFov / 2
        )

        *

        distance;


      const visibleWidth =
        visibleHeight * aspect;


      /*
        DESKTOP:
        object center ≈ 31% of viewport width.

        MOBILE:
        center artwork so it can never be cut.
      */

      if (narrow) {

        artworkGroup.position.x =
          0;


        artworkGroup.position.y =
          0;


        counter.style.left =
          "50%";

      } else {

        artworkGroup.position.x =
          -visibleWidth * 0.19;


        artworkGroup.position.y =
          0;


        counter.style.left =
          "31%";

      }

    }


    resize();


    window.addEventListener(
      "resize",
      resize
    );


    showSlide(0);

  </script>

</body>
</html>
